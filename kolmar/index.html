<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>한국콜마 리뉴얼 포트폴리오</title>

    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/CSS/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">

    <script src="../npm/swiper-bundle.min.js"></script>
</head>

<body>
    <div id="wrap">

        <header>
            제목공간
        </header>

        <main>
            <div class="hero-sec">

                <!-- Swiper 슬라이드 영역 -->
                <div class="swiper visual">

                    <div class="swiper-wrapper">

                        <!-- 첫 번째 슬라이드 -->
                        <div class="swiper-slide">
                            <img src="img/hero.png" alt="콜마 기니" class="pc">
                            <img src="img/m_visual01.jpg" alt="모바일 콜마 기니" class="mo">
                        </div>

                        <!-- 두 번째 슬라이드 -->
                        <div class="swiper-slide">
                            <img src="img/hero2.png" alt="콜마의 악마" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 콜마의 악마" class="mo">
                        </div>

                    </div>

                    <!-- 페이지네이션 -->
                    <div class="swiper-pagination"></div>

                </div>
            </div>
        </main>
        <footer>&copy;</footer>

    </div>

    <script>
        const swiperHero = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,

            // 페이지네이션
            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
            },
        });
    </script>
</body>
</html>
