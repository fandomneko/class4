<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest 로그인 | 디자인 테마 모아보기</title>
    <link rel="stylesheet" href="../font/css/notosanskrvariable.css">
    <link rel="stylesheet" href="login.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px 12px; background: #f2f3f7; font-family: "Noto Sans KR", sans-serif; }
        #wrap { position: relative; margin: 0 auto; }
        .theme-switcher { position: absolute; z-index: 50; top: 66px; right: 8px; display: flex; align-items: center; gap: 5px; padding: 5px 7px 5px 9px; border: 1px solid rgba(30,35,50,.2); border-radius: 9px; background: rgba(255,255,255,.94); box-shadow: 0 3px 12px rgba(0,0,0,.16); }
        .theme-switcher label { color: #242536; font-size: 1.05rem; font-weight: 800; white-space: nowrap; }
        #theme-select { width: 112px; height: 29px; padding: 0 5px; border: 0; outline: 0; border-radius: 5px; background: #f0f1f5; color: #202333; font: inherit; font-size: 1.05rem; }
        @media (max-width: 480px) { body { padding: 8px 4px; } .theme-switcher { top: 66px; right: 6px; } }
    </style>
    <link id="theme-style" rel="stylesheet" href="maximalism.css">
</head>
<body>
    <div id="wrap" class="maximalism">
        <div class="theme-switcher" aria-label="디자인 테마 변경">
            <label for="theme-select">THEME</label>
            <select id="theme-select" aria-label="로그인 화면 테마 선택">
                <option value="maximalism" selected>Maximalism</option>
                <option value="neo-brutalism">Brutalism</option>
                <option value="cyberpunk">Cyberpunk</option>
                <option value="isometric">Isometric</option>
                <option value="y2k-chrome">Y2K Chrome</option>
                <option value="glassmorphism">Glassmorphism</option>
            </select>
        </div>
        <header class="login_header">
            <a class="brand" href="#" aria-label="Pinterest 홈">
                <img src="img/Pinterest.png" alt="Pinterest">
            </a>
            <nav class="header_actions" aria-label="로그인 메뉴">
                <a href="#" class="login_link">로그인</a>
                <a href="#" class="signup_link">가입하기</a>
            </nav>
        </header>
        <main>
            <section class="hero" aria-label="Pinterest 소개">
                <div class="hero_image"><img src="img/pinimg" alt=""></div>
                <div class="hero_content">
                    <h1>Pinterest와 함께 원하는 삶<br>을 그려보세요</h1>
                    <div class="action_area">
                        <a href="#" class="primary_button">이메일로 계속하기</a>
                        <a href="#" class="secondary_button">이미 계정이 있습니다</a>
                    </div>
                    <p class="notice">
                        계속하면 Pinterest의 서비스 약관에 동의하고 개인정보 보호 정책을<br>
                        읽었음을 인정한 것으로 간주합니다. <a href="#">자세히 알기</a>
                    </p>
                </div>
            </section>
        </main>
    </div>
    <script>
        const themeSelect = document.querySelector("#theme-select");
        const themeStyle = document.querySelector("#theme-style");
        const preview = document.querySelector("#wrap");
        const themes = {
            "maximalism": "maximalism.css",
            "neo-brutalism": "brutalism.css",
            "cyberpunk": "cyberpunk.css",
            "isometric": "isometric.css",
            "y2k-chrome": "y2k-chrome.css",
            "glassmorphism": "glassmorphism.css"
        };

        themeSelect.addEventListener("change", function () {
            const selectedTheme = this.value;
            preview.className = selectedTheme;
            themeStyle.href = themes[selectedTheme];
        });
    </script>
</body>
</html>
