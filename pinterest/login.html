<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest 로그인</title>
    <link rel="stylesheet" href="../font/css/notosanskrvariable.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div id="wrap">
        <header class="login_header">
            <a class="brand" href="#" aria-label="Pinterest 홈">
                <img src="img/Pinterest.png" alt="Pinterest">
            </a>

            <nav class="header_actions" aria-label="로그인 메뉴">
                <a href="#" class="login_link">로그인</a>
                <a href="#" class="signup_link">가입하기</a>
            </nav>
        </header>

        <main>
            <section class="hero" aria-label="Pinterest 소개">
                <div class="hero_image">
                    <img src="img/pinimg" alt="">
                </div>

                <div class="hero_content">
                    <h1>Pinterest와 함께 원하는 삶<br>을 그려보세요</h1>

                    <div class="action_area">
                        <a href="#" class="primary_button">이메일로 계속하기</a>
                        <a href="#" class="secondary_button">이미 계정이 있습니다</a>
                    </div>

                    <p class="notice">
                        계속하면 Pinterest의 서비스 약관에 동의하고 개인정보 보호 정책을<br>
                        읽었음을 인정한 것으로 간주합니다. <a href="#">자세히 알기</a>
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
