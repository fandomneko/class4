<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../font/css/notosanskrvariable.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="pinterest_login.css">
    <title>Pinterest 로그인</title>
</head>
<body>
    <div id="wrap">
        <div class="status_bar" aria-hidden="true">
            <span>9:40</span>
            <span class="status_icons"><i></i><i></i><i></i></span>
        </div>

        <header>
            <a href="#" class="logo"><img src="img/Pinterest.png" alt="Pinterest"></a>
            <div class="header_links">
                <a href="#">로그인</a>
                <a href="#" class="join_btn">가입하기</a>
            </div>
        </header>

        <main>
            <div class="hero_image">
                <img src="img/pinimg" alt="Pinterest에서 영감을 얻을 수 있는 이미지">
            </div>

            <section class="login_content">
                <h1>Pinterest와 함께 원하는 삶<br>을 그려보세요</h1>

                <div class="login_buttons">
                    <a href="#" class="email_btn">이메일로 계속하기</a>
                    <a href="#" class="account_btn">이미 계정이 있습니다</a>
                    <p class="terms">
                        계속하면 Pinterest의 <a href="#">서비스 약관</a>에 동의하고 <a href="#">개인정보 보호 정책</a><br>
                        을 읽었음을 인정한 것으로 간주합니다. <a href="#">컬렉션 알림</a>.
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
